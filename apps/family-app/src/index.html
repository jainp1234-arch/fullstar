<!doctype html>
<html lang="en" data-mode="kid">
  <head>
    <meta charset="utf-8" />
    <title>FullStar</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Plan 9.3: browser bar in the sky colour; the home-screen icon (generated by tools/vendor-assets/app_icons.py) -->
    <meta name="theme-color" content="#2A0C5E" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Plan 9.3: the sky every first screen paints (also the splash below, until Angular starts) -->
    <link rel="preload" href="media/sky-stars.svg" as="image" type="image/svg+xml" />
    <!-- Plan 9.3: body text (the only weight preloaded; the others would compete with the start-up JS) -->
    <link
      rel="preload"
      href="media/poppins-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- Plan 9.2: Caddy writes this response's CSP nonce here (infra/caddy/security-headers.caddy) -->
    <!-- prettier-ignore -->
    <app-root ngCspNonce="{{placeholder `http.request.uuid`}}"><div class="ui-sky boot"></div></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>

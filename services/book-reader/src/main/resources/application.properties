spring.application.name=book-reader
# 8080 is the local Caddy and 8081 the API
server.port=${BOOK_READER_PORT:8082}
server.error.include-stacktrace=never
server.error.include-message=never

# JSON: snake_case, like the API and the Schema §12 envelope
spring.jackson.property-naming-strategy=SNAKE_CASE

# Structured JSON logs (Tech Stack §6, §10). Never log personal data.
logging.structured.format.console=ecs

# Actuator: health only
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Queues (Schema §12): AWS SQS (trial: ElasticMQ, SQS_ENDPOINT); the same settings as the API
fullstar.queues.endpoint=${SQS_ENDPOINT:}
fullstar.queues.region=${SQS_REGION:ap-south-1}
fullstar.queues.access-key-id=${SQS_ACCESS_KEY_ID:}
fullstar.queues.secret-access-key=${SQS_SECRET_ACCESS_KEY:}
fullstar.queues.prefix=${QUEUE_PREFIX:}
fullstar.queues.consumer-enabled=${QUEUE_CONSUMER_ENABLED:true}
fullstar.queues.wait-seconds=20

# Files (Schema §13): Cloudflare R2 through the S3 API (trial: SeaweedFS, S3_ENDPOINT)
fullstar.storage.endpoint=${S3_ENDPOINT:}
fullstar.storage.region=${S3_REGION:auto}
fullstar.storage.bucket=${S3_BUCKET:fullstar-dev}
fullstar.storage.access-key-id=${S3_ACCESS_KEY_ID:}
fullstar.storage.secret-access-key=${S3_SECRET_ACCESS_KEY:}

# Virus scan (Plan 5.2): clamd INSTREAM
fullstar.clamav.host=${CLAMAV_HOST:localhost}
fullstar.clamav.port=${CLAMAV_PORT:3310}
fullstar.clamav.timeout=120s

# Resilience4j for every outside call (Tech Stack §10): retry with exponential backoff and circuit
# breaker; timeouts are on the clients (S3/SQS call timeouts, the clamd socket timeout).
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

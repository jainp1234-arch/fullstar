spring.application.name=api
# 8080 belongs to the local Caddy (Schema §12a)
server.port=${API_PORT:8081}
server.error.include-stacktrace=never
server.error.include-message=never

# Database (Schema §7): app_api for requests, app_system for consumers, retention and deletion.
fullstar.datasource.api.jdbc-url=${DB_JDBC_URL:}
fullstar.datasource.api.username=app_api
fullstar.datasource.api.password=${DB_APP_API_PASSWORD:}
fullstar.datasource.api.pool-name=app-api
fullstar.datasource.api.maximum-pool-size=10
fullstar.datasource.system.jdbc-url=${DB_JDBC_URL:}
fullstar.datasource.system.username=app_system
fullstar.datasource.system.password=${DB_APP_SYSTEM_PASSWORD:}
fullstar.datasource.system.pool-name=app-system
fullstar.datasource.system.maximum-pool-size=3
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migrations run only with the migrate profile (make db-migrate), as app_owner.
spring.flyway.enabled=false
# Flyway keeps its history table in its own schema; the app schema is created by V1 (Schema §14)
spring.flyway.schemas=flyway
spring.flyway.default-schema=flyway

# JSON: snake_case field names (Schema §10)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Structured JSON logs (Tech Stack §6, §10). Never log personal data.
logging.structured.format.console=ecs

# Actuator: health and, for Prometheus (Plan 9.1), metrics, on their own port that Caddy never
# proxies; liveness and readiness groups
management.server.port=${MANAGEMENT_PORT:8091}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=api
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# API docs only with the local profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# App settings
fullstar.consent.version=${CONSENT_VERSION:2026-10-v1}
fullstar.privacy.notice-url=${PRIVACY_NOTICE_URL:}
fullstar.uploads.pdf-max-bytes=52428800
fullstar.uploads.pdf-max-pages=300
fullstar.uploads.photo-max-bytes=10485760
fullstar.uploads.photos-per-upload=50

# Resilience4j defaults for every outside call (Tech Stack §10): timeout, retry with exponential
# backoff, circuit breaker. Instances: claude, r2, sqs, gotenberg, keycloak.
resilience4j.timelimiter.configs.default.timeout-duration=10s
resilience4j.timelimiter.configs.default.cancel-running-future=true
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=5s
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
# Claude drafts and checks take longer
resilience4j.timelimiter.instances.claude.timeout-duration=60s
resilience4j.circuitbreaker.instances.claude.slow-call-duration-threshold=45s

# Keycloak (Schema §8): issuer and keys of realm fullstar; the parent-grant secret signs PIN grants (HS256)
fullstar.auth.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/fullstar}
fullstar.auth.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${fullstar.auth.issuer-uri}/protocol/openid-connect/certs}
fullstar.auth.parent-grant-secret=${PARENT_GRANT_SECRET:}

# Files (Schema §13): Cloudflare R2 through the S3 API (trial: SeaweedFS, S3_ENDPOINT)
fullstar.storage.endpoint=${S3_ENDPOINT:}
fullstar.storage.region=${S3_REGION:auto}
fullstar.storage.bucket=${S3_BUCKET:fullstar-dev}
fullstar.storage.access-key-id=${S3_ACCESS_KEY_ID:}
fullstar.storage.secret-access-key=${S3_SECRET_ACCESS_KEY:}
fullstar.storage.create-bucket=${S3_CREATE_BUCKET:false}
# Address in signed URLs for browsers (trial: http://localhost:8080 through Caddy); empty = S3_ENDPOINT
fullstar.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:}

# Queues (Schema §12): AWS SQS (trial: ElasticMQ, SQS_ENDPOINT)
fullstar.queues.endpoint=${SQS_ENDPOINT:}
fullstar.queues.region=${SQS_REGION:ap-south-1}
fullstar.queues.access-key-id=${SQS_ACCESS_KEY_ID:}
fullstar.queues.secret-access-key=${SQS_SECRET_ACCESS_KEY:}
fullstar.queues.prefix=${QUEUE_PREFIX:}
fullstar.queues.consumer-enabled=${QUEUE_CONSUMER_ENABLED:true}
fullstar.queues.wait-seconds=20

# Keycloak admin (Plan 4.1): service account fullstar-api-admin manages staff accounts and roles.
# An empty secret switches staff management off (503 FEATURE_DISABLED).
fullstar.keycloak-admin.base-url=${KEYCLOAK_ADMIN_URL:http://localhost:8080/auth}
fullstar.keycloak-admin.realm=fullstar
fullstar.keycloak-admin.client-id=fullstar-api-admin
fullstar.keycloak-admin.client-secret=${KEYCLOAK_API_ADMIN_SECRET:}
resilience4j.timelimiter.instances.keycloak.timeout-duration=10s

# Claude (Tech Stack §8a, §9; Plan 4.3): drafts and the content-check agent are off unless their
# flag is "true". Model ID is configuration; the key comes only from the environment.
fullstar.ai.drafts=${FEATURE_AI_DRAFTS:false}
fullstar.ai.check=${FEATURE_AI_CHECK:false}
fullstar.ai.api-key=${ANTHROPIC_API_KEY:}
fullstar.ai.model=${CLAUDE_MODEL:claude-sonnet-5-5}
fullstar.ai.max-tokens=8000
fullstar.ai.timeout=55s

# Worksheets (Plan 7.2): Gotenberg renders the A4 PDF (trial: the compose service on port 3000)
fullstar.gotenberg.url=${GOTENBERG_URL:http://localhost:3000}

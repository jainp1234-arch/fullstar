# make db-migrate: run Flyway only (no web server) as app_owner over the direct connection
spring.main.web-application-type=none
spring.flyway.enabled=true
spring.flyway.url=${DB_MIGRATE_JDBC_URL}
spring.flyway.user=app_owner
spring.flyway.password=${DB_APP_OWNER_PASSWORD}

# One-off commands never consume job results
fullstar.queues.consumer-enabled=false
# Nor refresh the Plan 9.1 metrics
fullstar.metrics.enabled=false

# Trial stand-in for AWS SQS (Schema §12, §12a): same queue names, a DLQ per queue, max receives 3.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  upload-scan { defaultVisibilityTimeout = 5 minutes, deadLettersQueue { name = "upload-scan-dlq", maxReceiveCount = 3 } }
  upload-scan-dlq {}

  book-process { defaultVisibilityTimeout = 15 minutes, deadLettersQueue { name = "book-process-dlq", maxReceiveCount = 3 } }
  book-process-dlq {}

  readalong-narrate { defaultVisibilityTimeout = 30 minutes, deadLettersQueue { name = "readalong-narrate-dlq", maxReceiveCount = 3 } }
  readalong-narrate-dlq {}

  lesson-narrate { defaultVisibilityTimeout = 30 minutes, deadLettersQueue { name = "lesson-narrate-dlq", maxReceiveCount = 3 } }
  lesson-narrate-dlq {}

  reading-score { defaultVisibilityTimeout = 5 minutes, deadLettersQueue { name = "reading-score-dlq", maxReceiveCount = 3 } }
  reading-score-dlq {}

  worksheet-render { defaultVisibilityTimeout = 2 minutes, deadLettersQueue { name = "worksheet-render-dlq", maxReceiveCount = 3 } }
  worksheet-render-dlq {}

  content-check { defaultVisibilityTimeout = 5 minutes, deadLettersQueue { name = "content-check-dlq", maxReceiveCount = 3 } }
  content-check-dlq {}

  job-results { defaultVisibilityTimeout = 2 minutes, deadLettersQueue { name = "job-results-dlq", maxReceiveCount = 3 } }
  job-results-dlq {}
}

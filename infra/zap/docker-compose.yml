# Plan 9.2: a throwaway stack for the OWASP ZAP baseline scan in CI (.github/workflows/zap.yml).
# Built apps behind Caddy with the real headers, the API on its own Postgres, ElasticMQ and SeaweedFS.
# No Keycloak: the scan is not signed in. ZAP_SECRET is generated per run and used for every password.
#   ZAP_SECRET=<random> docker compose -f infra/zap/docker-compose.yml up -d --wait
name: fullstar-zap

x-api-env: &api-env
  API_PORT: "8081"
  DB_JDBC_URL: jdbc:postgresql://db:5432/fullstar
  DB_MIGRATE_JDBC_URL: jdbc:postgresql://db:5432/fullstar
  DB_APP_OWNER_PASSWORD: ${ZAP_SECRET:?set ZAP_SECRET}
  DB_APP_API_PASSWORD: ${ZAP_SECRET}
  DB_APP_SYSTEM_PASSWORD: ${ZAP_SECRET}
  PARENT_GRANT_SECRET: ${ZAP_SECRET}
  SQS_ENDPOINT: http://elasticmq:9324
  SQS_ACCESS_KEY_ID: local
  SQS_SECRET_ACCESS_KEY: local
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: fullstar-zap
  S3_ACCESS_KEY_ID: zap
  S3_SECRET_ACCESS_KEY: ${ZAP_SECRET}
  S3_CREATE_BUCKET: "true"
  S3_PUBLIC_ENDPOINT: http://localhost:8088
  KEYCLOAK_ISSUER_URI: http://localhost:8088/auth/realms/fullstar
  CORS_ALLOWED_ORIGINS: http://localhost:8088

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: fullstar
      POSTGRES_PASSWORD: ${ZAP_SECRET}
      APP_OWNER_PASSWORD: ${ZAP_SECRET}
      APP_API_PASSWORD: ${ZAP_SECRET}
      APP_SYSTEM_PASSWORD: ${ZAP_SECRET}
    volumes:
      - ../db/bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "fullstar"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq:1.7.1
    volumes:
      - ../elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.23
    environment:
      S3_SECRET_ACCESS_KEY: ${ZAP_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"fullstar-api","credentials":[{"accessKey":"zap","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -ip.bind=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  api-migrate:
    image: fullstar/api:zap
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    command: ["--spring.profiles.active=migrate"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  api:
    image: fullstar/api:zap
    environment: *api-env
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      elasticmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  web:
    image: caddy:2.11.4
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/security-headers.caddy:/etc/caddy/security-headers.caddy:ro
      - ../../dist/family-app/browser:/srv/family:ro
      - ../../dist/content-studio/browser:/srv/studio:ro
    depends_on:
      - api

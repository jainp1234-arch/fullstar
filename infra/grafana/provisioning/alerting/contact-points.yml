apiVersion: 1

# Plan 9.1: every FullStar alert goes to ALERT_EMAIL through Brevo SMTP (GF_SMTP_* in compose).
# ALERT_EMAIL empty (trial default): SMTP is off and alerts show only in Grafana.
contactPoints:
  - orgId: 1
    name: fullstar-email
    receivers:
      - uid: fullstar-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: fullstar-email
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

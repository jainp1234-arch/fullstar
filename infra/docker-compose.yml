# Local services (Plan 0.5, trial mode: Tech Stack §8a, Schema §12a).
# Run from the repository root: make up / make down (reads ./.env).
# Host ports bind to 127.0.0.1 only.

name: fullstar

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    <<: *restart
    image: caddy:2.11.4
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/security-headers.caddy:/etc/caddy/security-headers.caddy:ro
      - caddy-data:/data
    environment:
      # The bucket path is proxied to SeaweedFS so browsers upload on the same address (Plan 5.1)
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/metrics"]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak-db:
    <<: *restart
    image: postgres:18.6
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    <<: *restart
    build:
      context: ..
      dockerfile: infra/keycloak/Dockerfile
    image: fullstar/keycloak:local
    # Imports infra/keycloak/realm/fullstar-realm.json when the realm does not exist yet.
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
    environment:
      # Resolved inside the realm import (SMTP via Brevo, Schema §12a)
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Secret of the fullstar-api-admin client, resolved inside the realm import (Plan 4.1)
      KEYCLOAK_API_ADMIN_SECRET: ${KEYCLOAK_API_ADMIN_SECRET:?set KEYCLOAK_API_ADMIN_SECRET in .env}
      # Served behind Caddy at /auth; hostname unset so the tunnel address also works (Schema §12a).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  gotenberg:
    <<: *restart
    image: gotenberg/gotenberg:8.37.0
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  clamav:
    <<: *restart
    image: clamav/clamav:1.4.6
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 4
      # First start downloads the virus signatures; later starts reuse the volume.
      start_period: 170s

  seaweedfs:
    <<: *restart
    image: chrislusf/seaweedfs:4.23
    # S3 keys from .env, so signed URLs are really checked (the identity file is written at start, never committed)
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"fullstar-api","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  elasticmq:
    <<: *restart
    image: softwaremill/elasticmq:1.7.1
    ports:
      - "127.0.0.1:9324:9324"
      - "127.0.0.1:9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9324/?Action=ListQueues"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Plan 5.3: the upload scan and book-process worker, with Tesseract 5.5.3 and cwebp built in.
  # It reaches the queues, storage and ClamAV by service name; it never touches the database.
  book-reader:
    <<: *restart
    build:
      context: ..
      dockerfile: services/book-reader/Dockerfile
    image: fullstar/book-reader:local
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY_ID:-local}
      SQS_SECRET_ACCESS_KEY: ${SQS_SECRET_ACCESS_KEY:-local}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      elasticmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  # Plan 8.3: the reading-score worker, faster-whisper small (CPU, int8) built into the image.
  # It reads recordings from storage and answers on job-results; it never touches the database.
  reading-checker:
    <<: *restart
    build:
      context: ../workers/reading-checker
    image: fullstar/reading-checker:local
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY_ID:-local}
      SQS_SECRET_ACCESS_KEY: ${SQS_SECRET_ACCESS_KEY:-local}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      WHISPER_THREADS: ${WHISPER_THREADS:-2}
    depends_on:
      elasticmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Plan 8.2: narrates read-along chapters and published lessons. It needs about 8 GB of memory, so it
  # starts only with the voice profile (make voice); until then the jobs wait in their queues.
  voice-maker:
    <<: *restart
    profiles: [voice]
    build:
      context: ../workers/voice-maker
      secrets: [hf_token]
    image: fullstar/voice-maker:local
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY_ID:-local}
      SQS_SECRET_ACCESS_KEY: ${SQS_SECRET_ACCESS_KEY:-local}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      VOICE_THREADS: ${VOICE_THREADS:-4}
    depends_on:
      elasticmq:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  loki:
    <<: *restart
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # The image has no shell or HTTP client; alloy's healthcheck also requires loki /ready.

  alloy:
    <<: *restart
    image: grafana/alloy:v1.20.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read container logs (local development only; see README "Run locally").
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          for t in 127.0.0.1:12345/-/ready loki:3100/ready; do
          h=$${t%%/*}; p=/$${t#*/};
          exec 3<>/dev/tcp/$${h%:*}/$${h#*:} || exit 1;
          printf 'GET %s HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' "$$p" "$$h" >&3;
          head -1 <&3 | grep -q ' 200 ' || exit 1;
          exec 3>&-;
          done
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # make api runs on the laptop; its metrics are on the management port 8091 (Plan 9.1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Plan 9.1: disk use for the "disk over 80%" alert (the Docker disk on the laptop)
  node-exporter:
    <<: *restart
    image: prom/node-exporter:v1.12.1
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro

  grafana:
    <<: *restart
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Plan 9.1: alert email through Brevo only when ALERT_EMAIL is set (trial: off by default)
      ALERT_EMAIL: ${ALERT_EMAIL:-alerts-off@localhost.invalid}
      GF_SMTP_ENABLED: ${ALERT_EMAIL:+true}
      GF_SMTP_HOST: ${SMTP_HOST:-}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USERNAME:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${MAIL_FROM:-alerts@localhost.invalid}
      GF_SMTP_FROM_NAME: FullStar alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

# Build-time only: the gated voice model download (Plan 8.2)
secrets:
  hf_token:
    environment: HF_TOKEN

volumes:
  caddy-data:
  keycloak-db:
  clamav-db:
  seaweedfs-data:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:

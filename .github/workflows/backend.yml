name: backend

on:
  pull_request:
    paths: &paths
      - 'services/**'
      - 'infra/keycloak/email-otp/**'
      - 'infra/keycloak/realm/**'
      - 'infra/db/**'
      - 'mvnw'
      - '.mvn/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven-verify:
    name: verify ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [services/api, services/book-reader, infra/keycloak/email-otp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # setup-java cannot address the 21.0.12.1 respin directly; the next step enforces it.
          java-version: '21.0.12'
          cache: maven
      - name: Require Temurin 21.0.12.1+1
        run: java -version 2>&1 | tee /dev/stderr | grep -q '21.0.12.1+1'
      - run: ./mvnw -B -ntp -f ${{ matrix.project }}/pom.xml verify
